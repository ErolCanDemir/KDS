# LST-KDS SPA — istemci-taraflı yönlendirme (React Router): bilinmeyen yollar index.html'e düşer.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Hash'li varlıklar uzun önbellek; index.html önbelleklenmez (yeni sürüm hemen görünür).
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
