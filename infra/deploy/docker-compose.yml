# LST-KDS — tek-VM yayın (00-analiz §10: v1 barındırma da Compose). Tüm yığın: MSSQL + Keycloak
# + Mongo (olay günlüğü) + API + önyüz. Parolalar .env'den (.env.example → .env kopyala, doldur).
# Çalıştır: infra/deploy/ içinden  ->  docker compose up -d --build
# Build bağlamları repo köküne (../..) göre.
name: lst-kds

services:
  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SA_PAROLA}
    ports:
      - "1433:1433"
    volumes:
      - mssql-veri:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q \"SELECT 1\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  keycloak:
    image: quay.io/keycloak/keycloak:26.3
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: ${KC_ADMIN:-admin}
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KC_ADMIN_PAROLA}
      KC_HEALTH_ENABLED: "true"
    ports:
      - "8080:8080"
    volumes:
      # Realm (kds; kds-web/kds-api istemcileri; roller) açılışta içe alınır.
      - ../kds-realm.json:/opt/keycloak/data/import/kds-realm.json:ro
      - keycloak-veri:/opt/keycloak/data

  mongo:
    image: mongo:7
    volumes:
      - mongo-veri:/data/db
    # Yalnız iç ağ (olay günlüğü) — dışarı açılmaz.

  api:
    build:
      context: ../..
      dockerfile: src/Kds.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # İlk açılışta metadata şemasını (migration) uygula.
      MigrationUygula: "true"
      # S16: ürün yapılandırması ORTAM DEĞİŞKENLERİNDEN (kaynak sırası #1) — kurulum sihirbazı
      # devreye girmez, "değişmez dağıtım". Ayrıntı: infra/KURULUM.md.
      KDS_VERI_DIZINI: /var/lib/kds
      KDS_METADATA_BAGLANTI: "Server=mssql,1433;Database=KdsMetadata;User Id=sa;Password=${SA_PAROLA};TrustServerCertificate=True"
      # İçe alım depo SUNUCUSU (DB'siz — kiracı başına depo DB'si yaratılır).
      KDS_DEPO_BAGLANTI: "Server=mssql,1433;User Id=sa;Password=${SA_PAROLA};TrustServerCertificate=True"
      KDS_LOG_BAGLANTI: "mongodb://mongo:27017"
      # Kimlik: token issuer'ı PUBLIC URL (tarayıcının gördüğü); metadata İÇ ağdan çekilir.
      KDS_KIMLIK_YETKILI: "${PUBLIC_KEYCLOAK:-http://localhost:8080}/realms/kds"
      KDS_KIMLIK_METADATA: "http://keycloak:8080/realms/kds/.well-known/openid-configuration"
      KDS_KIMLIK_ISTEMCI: "kds-api"
      KDS_KIMLIK_HTTPS: "false"
      KDS_ONYUZ_ADRES: "${PUBLIC_ONYUZ:-http://localhost:5173}"
    volumes:
      # Veri dizini KALICI olmalı (şifreleme anahtarları) — bkz. infra/KURULUM.md §5.
      - kds-veri:/var/lib/kds
    ports:
      - "5210:5210"
    depends_on:
      mssql:
        condition: service_healthy
      keycloak:
        condition: service_started
      mongo:
        condition: service_started

  frontend:
    build:
      context: ../../frontend
      dockerfile: Dockerfile
      # Vite BUILD-zamanı: tarayıcının göreceği adresler.
      args:
        VITE_API_ADRES: "${PUBLIC_API:-http://localhost:5210}"
        VITE_KIMLIK_YETKILI: "${PUBLIC_KEYCLOAK:-http://localhost:8080}/realms/kds"
        VITE_KIMLIK_ISTEMCI: "kds-web"
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  mssql-veri:
  keycloak-veri:
  mongo-veri:
  kds-veri:
